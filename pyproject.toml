[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hark"
dynamic = ["version"]
description = "Local-first push-to-talk dictation for Linux"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sravan" }]
requires-python = ">=3.10"
keywords = ["dictation", "speech-to-text", "voice", "wayland", "linux", "whisper", "parakeet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "evdev>=1.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
stt = [
    "onnx-asr[cpu,hub]",
    "faster-whisper>=1.1",
]
# Essentials has Widgets/Gui/DBus; the full PySide6 adds ~300 MB of WebEngine etc.
# 6.12 drops a reference to None on every void Qt call under Python 3.11 (None isn't
# immortal before 3.12), crashing the app within minutes ("none_dealloc"); fine on 3.12+.
# tests/test_ui.py checks for it.
gui = [
    "PySide6-Essentials>=6.6,<6.12; python_version < '3.12'",
    "PySide6-Essentials>=6.6; python_version >= '3.12'",
]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/Sravan1011/Hark.ai"
Source = "https://github.com/Sravan1011/Hark.ai"
Issues = "https://github.com/Sravan1011/Hark.ai/issues"

[project.scripts]
hark = "hark.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hark.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
