name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Debian 12 (and the PySide6 < 6.12 pin); 3.12 = Ubuntu 24.04 / Fedora.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries (PortAudio, Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e ".[stt,gui,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Installer scripts parse
        run: bash -n install.sh && bash -n scripts/setup-linux.sh && bash -n scripts/install-ollama.sh
